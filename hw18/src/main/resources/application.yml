server:
  port: 8080
  error:
    whitelabel:
      enabled: false
    path: "/error"

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      bookService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

      getBookById:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 40
        wait-duration-in-open-state: 5s

      getAllBooks:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 8
        minimum-number-of-calls: 4
        failure-rate-threshold: 60
        wait-duration-in-open-state: 8s

  timelimiter:
    instances:
      bookService:
        timeout-duration: 3s
      getBookById:
        timeout-duration: 2s
      getAllBooks:
        timeout-duration: 4s

  retry:
    instances:
      bookService:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

  bulkhead:
    instances:
      bookService:
        max-concurrent-calls: 5
        max-wait-duration: 100ms

  ratelimiter:
    instances:
      bookService:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: "/actuator"
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
    logfile:
      enabled: true
    hystrix:
      stream:
        enabled: true
  health:
    defaults:
      enabled: true
  metrics:
    export:
      simple:
        enabled: true
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

spring:
  application:
    name: book-service-VVS  # важно для Turbine!
  data:
    rest:
      base-path: /datarest
  jmx:
    enabled: true
  mvc:
    throw-exception-if-no-handler-found: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  thymeleaf:
    cache: false
  messages:
    baseName: messages
    encoding: UTF-8
    # Не дает свалиться в системную локаль если не найден файл для переданной в MessageSource
    # Если false то будут браться сообщения из дефолтного файла, если true, то из файла соответствующего системной локали
    fallbackToSystemLocale: false
  output:
    ansi:
      enabled: ALWAYS

  datasource:
#    url: jdbc:h2:mem:maindb
    driver-class-name: org.postgresql.Driver
#    password: ${SPRING_DATASOURCE_PASSWORD}
#    username: ${SPRING_DATASOURCE_USERNAME}
#    url: ${SPRING_DATASOURCE_URL}
  liquibase:
    enabled: true
    contexts: dev


  jpa:
#    database-platform: org.hibernate.dialect.H2Dialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
app:
  templates:
    error: "static/error-template.txt"

logging:
  file:
    name: application.log
    path: ./logs
  level:
    org.springframework.web: INFO
    ru.otus.hw: DEBUG
